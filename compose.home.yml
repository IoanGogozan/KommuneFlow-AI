name: kommuneflow-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - app_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3101
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      STATUS_CODE_PEPPER: ${STATUS_CODE_PEPPER:?STATUS_CODE_PEPPER is required}
      UPLOAD_STORAGE_PATH: /app/uploads
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      FORM_BODY_LIMIT: ${FORM_BODY_LIMIT:-1mb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-nb}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-nb,en}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_RECRUITER_PASSWORD: ${SEED_RECRUITER_PASSWORD:-}
    expose:
      - "3101"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3101/api/v1/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app_internal

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEMO_BASIC_AUTH_USER: ${DEMO_BASIC_AUTH_USER:?DEMO_BASIC_AUTH_USER is required}
      DEMO_BASIC_AUTH_HASH: ${DEMO_BASIC_AUTH_HASH:?DEMO_BASIC_AUTH_HASH is required}
    expose:
      - "8080"
    volumes:
      - ./deploy/home/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_gateway/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      app_internal:
      proxy:
        aliases:
          - kommuneflow-ai

networks:
  app_internal:
    driver: bridge
  proxy:
    external: true
    name: proxy

volumes:
  postgres_data:
    name: kommuneflow-ai-postgres-data
  uploads_data:
    name: kommuneflow-ai-uploads-data
