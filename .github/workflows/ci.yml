name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PROVIDER: mock

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kommuneflow_ai_test
          POSTGRES_USER: kommuneflow
          POSTGRES_PASSWORD: kommuneflow_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kommuneflow -d kommuneflow_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @kommuneflow/api prisma:generate
        env:
          DATABASE_URL: postgresql://kommuneflow:kommuneflow_test_password@localhost:5433/kommuneflow_ai_test

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: API unit and coverage tests
        run: pnpm --filter @kommuneflow/api test:cov:ci

      - name: Web tests
        run: pnpm --filter @kommuneflow/web test

      - name: Install Playwright browser
        run: pnpm --filter @kommuneflow/web exec playwright install --with-deps chromium

      - name: Web Playwright e2e
        run: pnpm --filter @kommuneflow/web test:e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3101/api/v1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python ELT
        working-directory: apps/etl
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python ELT tests
        working-directory: apps/etl
        run: pytest -q

      - name: Prepare e2e database
        run: pnpm --filter @kommuneflow/api prisma migrate deploy
        env:
          DATABASE_URL: postgresql://kommuneflow:kommuneflow_test_password@localhost:5433/kommuneflow_ai_test

      - name: PostgreSQL-backed API e2e tests
        run: pnpm --filter @kommuneflow/api test:e2e:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kommuneflow:kommuneflow_test_password@localhost:5433/kommuneflow_ai_test
          JWT_SECRET: ci-test-jwt-secret
          SESSION_SECRET: ci-test-session-secret
          UPLOAD_STORAGE_PATH: ./storage/ci-uploads
          APP_BASE_URL: http://localhost:3000
          CORS_ALLOWED_ORIGINS: http://localhost:3000

      - name: Seed synthetic full-stack data
        run: SEED_DEMO_PASSWORD="DemoPassword123!" pnpm --filter @kommuneflow/api prisma:seed
        env:
          DATABASE_URL: postgresql://kommuneflow:kommuneflow_test_password@localhost:5433/kommuneflow_ai_test

      - name: Full-stack browser smoke
        run: pnpm --filter @kommuneflow/web test:e2e:fullstack
        env:
          DATABASE_URL: postgresql://kommuneflow:kommuneflow_test_password@localhost:5433/kommuneflow_ai_test
          JWT_SECRET: ci-test-jwt-secret
          SESSION_SECRET: ci-test-session-secret
          AI_PROVIDER: mock
          FULLSTACK_DEMO_PASSWORD: DemoPassword123!
          UPLOAD_STORAGE_PATH: ./storage/ci-fullstack-uploads
          APP_BASE_URL: http://localhost:3000
          CORS_ALLOWED_ORIGINS: http://localhost:3000

      - name: Dependency audit
        run: pnpm audit:deps

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
